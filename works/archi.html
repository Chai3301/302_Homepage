<body>

  <header class="nav">
    <a href="../index.html" class="nav-logo">chai</a>
    <nav class="nav-links">
      <a href="../info/info.html">info</a>
    </nav>
  </header>

  <main class="article article--text-grid">
    <div class="article-gallery article-gallery--text js-reveal" aria-label="テキスト一覧">
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">壁は境界であると同時に、手前の空気を測るための道具でもある。厚みを見るのではなく、手前に残る余白の量を見る。サンプルメモ。建築史探求のための仮テキストです。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">窓は光を入れる装置というより、外の距離を切り取る枠である。比率が変わると、部屋の時間の進み方も変わる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">わずかな段差は、移動の速度を落とす。落とされた速度のなかで、空間ははじめて読まれる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">柱は支えるためだけに立っているのではない。間隔そのものが、人が通れるかどうかを先に決めている。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">影がはっきりしているとき、形は強く見える。ぼやけているとき、形は空気に近い。どちらも建築の表情である。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">廊下は移動のための余白であり、思考のための余白でもある。長すぎると物語になり、短すぎると手続きになる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">低い天井は圧迫ではなく、親密さの形式になり得る。頭上の近さが、声の大きさを変える。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">手で触れたときの温度は、見た目の印象を書き換える。冷たい石も、長い時間のあとでは別の意味を持つ。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">角を丸めるか、鋭く残すか。その選択は、空間が人を受け入れるか、人を緊張させるかを左右する。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">同じ形の反復は秩序をつくる。そこに小さなずれが入ると、秩序はリズムになる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">迷いのない入口は便利だが、記憶に残りにくい。少し迷わせる入口は、到着の感覚を強める。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">足音が返ってくる部屋と、吸い込まれていく部屋がある。音は、空間の密度を測るもう一つの尺度である。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">内と外がはっきり分かれているとき、建築は閉じる。曖昧なとき、建築は周囲と交渉を始める。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">大きなものに小さなディテールを重ねると、距離感が揺らぐ。揺らぐこと自体が、体験の厚みになる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">分岐は選択を強いる。選択の手前で立ち止まる時間が、空間の意味を増やすことがある。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">何もない場所は、未完成ではない。空白は、次の行為を待つための準備である。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">朝の光と夕方の光では、同じ壁でも別の面になる。建築は一日のなかで何度も書き換わる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">握った瞬間に分かる太さがある。身体が先に理解し、言葉はあとから追いつく。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">建築は単独では完結しない。隣の建物、通りの幅、遠くの空まで含めて、ひとつの断片として現れる。</p>
        </div>
      </button>
      <button type="button" class="article-gallery-text-item" data-text-lightbox>
        <div class="article-gallery-text-item__body">
          <p class="article-text">まだ書けないことを残しておく場所が必要である。探求とは、完成させることではなく、問いを並べ続けることかもしれない。</p>
        </div>
      </button>
    </div>
  </main>
